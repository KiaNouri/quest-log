{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-xl py-4">
  <div class="row row-cards justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Start a quest: {{ game.title }}</h3>
        </div>
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            {% if game.cover_image_url %}
              <img src="{{ game.cover_image_url }}" alt="{{ game.title }}" class="rounded me-3" style="width: 64px; height: 64px; object-fit: cover;">
            {% endif %}
            <div>
              <div class="fw-bold">{{ game.title }}</div>
              {% if game.developer %}<div class="text-muted small">{{ game.developer }}</div>{% endif %}
            </div>
          </div>
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="game" value="{{ game.slug }}">
            {{ form|crispy }}
            <div class="form-footer d-flex justify-content-end gap-2">
              <a href="{% url 'games:backlog' %}" class="btn btn-link">Cancel</a>
              <button type="submit" class="btn btn-primary">Start Quest</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
