{% load static %}
<!doctype html>
<html lang="en">

<head>
    {% include "partials/_head.html" %}
</head>

<body>

    <header class="navbar navbar-expand-md navbar-light d-print-none">
        <div class="container-xl">
            <a href="{% url 'pages:intro' %}" class="navbar-brand text-decoration-none d-flex align-items-center gap-2">
                <i class="ti ti-sword text-primary" style="font-size: 1.6rem;"></i>
                <span class="fw-bold">Questlog</span>
            </a>

            <div class="navbar-nav flex-row order-md-last ms-auto align-items-center gap-2">
                <button type="button" id="theme-toggle" class="btn btn-icon btn-ghost-secondary"
                    aria-label="Toggle dark mode">
                    <i class="ti ti-moon ti-size-3 theme-icon-dark"></i>
                    <i class="ti ti-sun-high ti-size-3 theme-icon-light"></i>
                </button>
                <a href="{% url 'account_login' %}" class="btn btn-ghost-secondary">Log in</a>
                <a href="{% url 'account_signup' %}" class="btn btn-primary">Sign up</a>
            </div>
        </div>
    </header>

    <div class="page-body">
        <div class="container-xl">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% include "partials/_footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
    <script src="{% static 'js/custom.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
