{% extends "_base.html" %}

{% block content %}
<div class="container-xl py-4">
  <div class="row row-cards justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Delete review?</h3>
        </div>
        <div class="card-body">
          <p>
            This will permanently delete your review of
            <strong>{{ review.game.title }}</strong>. You can write a new
            one for this game afterward if you'd like.
          </p>
          <form method="post">
            {% csrf_token %}
            <div class="form-footer d-flex justify-content-end gap-2">
              <a href="{{ review.get_absolute_url }}" class="btn btn-link">Cancel</a>
              <button type="submit" class="btn btn-danger">Delete Review</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
