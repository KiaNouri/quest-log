{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-xl py-4">
  <div class="row row-cards justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Review {{ quest.game.title }}</h3>
        </div>
        <div class="card-body">
          <div class="alert alert-info">
            Submitting this review will mark your quest complete.
          </div>
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-footer d-flex justify-content-end gap-2">
              <a href="{% url 'quests:detail' quest.pk %}" class="btn btn-link">Cancel</a>
              <button type="submit" class="btn btn-primary">Submit Review</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
