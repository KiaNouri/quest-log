{% extends "_auth_base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} · Questlog{% endblock %}

{% block auth_content %}

<div class="text-center mb-3">
    <i class="ti ti-circle-check text-success" style="font-size: 2rem;"></i>
</div>

<h2 class="text-center mb-1">{% trans "Password changed" %}</h2>
<p class="text-muted text-center mb-4">
    {% trans "Your password has been changed successfully." %}
</p>

<a href="{% url 'account_login' %}" class="btn btn-primary w-100">{% trans "Log in" %}</a>

{% endblock %}
