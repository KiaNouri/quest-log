{% extends "_auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign up · Questlog{% endblock %}

{% block auth_content %}

<h2 class="text-center mb-1">Start your journey</h2>
<p class="text-muted text-center mb-4">Create an account to begin tracking quests.</p>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <div class="form-footer">
        <button type="submit" class="btn btn-primary w-100">Create account</button>
    </div>
</form>

<div class="text-center text-muted mt-3">
    Already have an account? <a href="{% url 'account_login' %}">Log in</a>
</div>

{% endblock %}
