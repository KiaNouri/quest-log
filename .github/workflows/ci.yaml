name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: django_project.settings.local
      SECRET_KEY: ci-test-secret-key
      POSTGRES_HOST: localhost
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      EMAIL_HOST_USER: build-placeholder@example.com
      EMAIL_HOST_PASSWORD: build-placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

      - name: Django deployment checks
        run: python manage.py check --deploy --settings=django_project.settings.production
        env:
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
          DATABASE_URL: postgres://test:test@localhost:5432/test